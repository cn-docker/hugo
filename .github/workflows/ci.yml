name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Process metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ vars.DOCKER_ORGANIZATION }}/${{ env.IMAGE_NAME }}
            ${{ vars.REGISTRY_GITHUB }}/${{ github.repository }}
      - name: Login to GitHub registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_GITHUB }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ vars.REGISTRY_GITHUB }}/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=${{ vars.REGISTRY_GITHUB }}/${{ github.repository }}:buildcache,mode=max
